<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>個人通訊</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>個人通訊</h1>
    <span id="status" class="status">離線（本地模式）</span>
    <img id="avatar" class="avatar" alt="" hidden>
    <button type="button" id="btn-settings" class="settings-btn">設定</button>
  </header>

  <main class="layout">
    <section id="conversation" class="conversation" aria-live="polite">
      <p class="empty">尚無訊息。</p>
    </section>

    <details id="settings" class="account" hidden>
      <summary>設定（偏好與頭像，僅存在此瀏覽器）</summary>
      <form id="prefs-form" class="prefs-form">
        <label>字體大小 <input name="fontSize" type="number" min="12" max="24" step="1"></label>
        <label>字體
          <select name="fontFamily">
            <option value="system">系統字體</option>
            <option value="serif">襯線</option>
            <option value="mono">等寬</option>
          </select>
        </label>
        <label>版面寬度（px） <input name="width" type="number" min="480" max="1200" step="10"></label>
        <label>頭像 <input name="avatar" type="file" accept="image/*"></label>
        <label>通知
          <select name="notifyMode">
            <option value="web">網頁通知</option>
            <option value="off">關閉</option>
          </select>
        </label>
        <label>音效
          <select name="notifySound">
            <option value="ding">叮</option>
            <option value="chime">風鈴</option>
            <option value="none">靜音</option>
          </select>
        </label>
        <label>自訂音效（≤1MB 音訊） <input name="customSound" type="file" accept="audio/*"></label>
        <button type="button" id="btn-notify-test">測試通知</button>
        <p id="notify-msg" class="acct-msg"></p>
        <div id="social-panel" class="storage">
          <h3>好友與群組（僅存在這台裝置）</h3>
          <p class="acct-msg">我的分享代號（給朋友輸入或掃描）：</p>
          <p id="my-share" class="acct-msg" style="word-break:break-all"></p>
          <label>加好友（輸入代號或 PMA1 分享代號）<input id="friend-input" type="text"></label>
          <button type="button" id="btn-add-friend">加入好友</button>
          <ul id="friend-list"></ul>
          <label>群組名稱 <input id="group-name" type="text" maxlength="40"></label>
          <button type="button" id="btn-create-group">建立群組</button>
          <ul id="group-list"></ul>
          <p id="social-msg" class="acct-msg"></p>
        </div>
        <div class="storage">
          <h3>貼圖庫</h3>
          <label>匯入貼圖（YAML） <input id="sticker-import" type="file" accept=".yaml,.yml,text/yaml,text/plain"></label>
          <button type="button" id="btn-sticker-export">匯出貼圖（YAML）</button>
          <p id="sticker-msg" class="acct-msg"></p>
          <p class="acct-msg">格式見 docs/DESIGN.md 第 12 節。svg 會檢查安全性（不可含腳本或事件屬性）。</p>
        </div>
        <div class="storage">
          <h3>儲存空間</h3>
          <p id="storage-info" class="acct-msg"></p>
          <button type="button" id="btn-clear-local">清除本機所有訊息</button>
          <p class="acct-msg">只刪除這台裝置上的資料；已歸檔到 Cloudflare / Supabase 的內容不會被刪除。</p>
        </div>
      </form>
    </details>
    <details id="account" class="account">
      <summary id="acct-summary">未登入（長期歸檔需要登入）</summary>
      <form id="login-form" autocomplete="on">
        <input name="code" placeholder="帳號代號" required pattern="[A-Za-z0-9_-]{3,32}" autocomplete="username">
        <input name="password" type="password" placeholder="密碼" required autocomplete="current-password">
        <button type="submit">登入</button>
      </form>
      <form id="register-form" autocomplete="on" hidden>
        <input name="code" placeholder="帳號代號（3–32 字元）" required pattern="[A-Za-z0-9_-]{3,32}" autocomplete="username">
        <input name="password" type="password" placeholder="密碼（至少 8 字元）" required minlength="8" autocomplete="new-password">
        <input name="password2" type="password" placeholder="再輸入一次密碼" required minlength="8" autocomplete="new-password">
        <input name="invite" placeholder="邀請碼" required autocomplete="off">
        <button type="submit">註冊</button>
      </form>
      <button type="button" id="btn-toggle-reg">沒有帳號？註冊</button>
      <p id="acct-msg" class="acct-msg"></p>
    </details>
    <div id="sticker-picker" class="sticker-picker" hidden></div>
    <form id="composer" class="composer" autocomplete="off">
      <button type="button" id="btn-voice" title="錄製語音">🎤</button>
      <button type="button" id="btn-stickers" title="貼圖">🙂</button>
      <label class="attach" title="傳送檔案">
        📎
        <input type="file" id="file-input" multiple hidden>
      </label>
      <input type="text" id="text-input" placeholder="輸入訊息…" aria-label="訊息">
      <button type="submit">送出</button>
    </form>
    <div id="voice-panel" class="voice-panel" hidden>
      <span id="voice-state">錄音中…</span>
      <p id="voice-subtitle" class="voice-subtitle"></p>
      <button type="button" id="btn-voice-stop">停止並送出</button>
      <button type="button" id="btn-voice-cancel">取消</button>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
